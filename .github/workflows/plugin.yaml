name: Build Plugin

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

jobs:

  Build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Build
      run: bash ./build.sh

    - name: Remove PDB files
      run: |
        find ./build -name "*.pdb" -type f -delete

    - name: Remove JSON files
      run: |
        find ./build -name "*.json" -type f -delete

    - uses: actions/upload-artifact@main
      with:
        name: "DialModeSwitcher"
        path: |
          ./build/*.dll
          !./build/*.pdb